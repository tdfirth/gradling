[experiment]
study = "gpt2"
name = "baseline"
notes = "Initial attempt to replicate GPT-125M results"

[config]
seed = 42
n_layers = 12
d_model = 768
n_heads = 12
d_head = 64
n_ctx = 1024
dropout = 0.0
batch_size = 512 # 512 * 1024 = 524288 tokens which lines up with GPT3 paper
micro_batch_size = 64
learning_rate = 0.0006
momentum = 0.9
train_steps = 19000
dry_run = false
experiment_name = "baseline"
checkpoint_label = "final"
